spring:
  application:
    name:
      sport_trainings
  datasource:
    url: jdbc:postgresql://localhost:5435/BOTdb
    username: pguser
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db_migrations/db.changelog-master.yaml
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

telegram:
  token: ${BOT_TOKEN}
  username: ${BOT_NAME}
  url: ${BOT_URL}

